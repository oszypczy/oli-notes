services:
  notes:
    image: ghcr.io/oszypczy/notes:latest
    volumes:
      - ~/data/notes/pdfs:/usr/share/nginx/html/pdfs:ro
    depends_on:
      auth:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
      - proxy

  auth:
    image: ghcr.io/oszypczy/notes-auth:latest
    env_file: .env
    volumes:
      - ~/data/notes/logs:/app/data
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    external: true
