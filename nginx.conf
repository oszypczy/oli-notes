limit_req_zone $binary_remote_addr zone=pdf_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:2m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- SPA - React (publiczny) ---
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # --- PDFy - CHRONIONE ---
    location /pdfs/ {
        limit_req zone=pdf_limit burst=5 nodelay;
        auth_request /internal/auth/verify;
        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $user_id;
        error_page 401 = @unauthorized;
        add_header Content-Disposition "inline" always;
        # Powtórzenie security headers (nginx nie dziedziczy add_header w bloku z własnym)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        autoindex off;
    }

    # --- tree.json - też chroniony ---
    location = /pdfs/tree.json {
        auth_request /internal/auth/verify;
        error_page 401 = @unauthorized;
    }

    # --- Internal: weryfikacja auth (niedostępna z zewnątrz) ---
    location = /internal/auth/verify {
        internal;
        proxy_pass http://auth:3000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Auth endpoints → proxy do backendu ---
    location /auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI "";
    }

    # --- Admin panel → proxy do backendu ---
    location = /admin {
        limit_req zone=admin_limit burst=5 nodelay;
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin/ {
        limit_req zone=admin_limit burst=5 nodelay;
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # --- Admin API → osobny rate limit ---
    location /api/admin/ {
        limit_req zone=admin_limit burst=10 nodelay;
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # --- API endpoints → proxy do backendu ---
    location /api/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # --- Obsługa 401 ---
    location @unauthorized {
        default_type application/json;
        return 401 '{"error": "unauthorized"}';
    }
}
