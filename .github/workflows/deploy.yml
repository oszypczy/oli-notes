name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/oszypczy/notes:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u oszypczy --password-stdin
            docker pull ghcr.io/oszypczy/notes:latest
            mkdir -p ~/apps/notes ~/data/notes/pdfs
            cd ~/apps/notes
            cat > docker-compose.yml << 'COMPOSE'
            services:
              notes:
                image: ghcr.io/oszypczy/notes:latest
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /home/opc/data/notes/pdfs:/usr/share/nginx/html/pdfs:ro
                  - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:80/"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            COMPOSE
            docker compose up -d --force-recreate
